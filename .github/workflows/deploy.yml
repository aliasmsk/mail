---
name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.10.1
        with:
          setup_python: "true"
          python_version: "3.11"

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Postfix
        uses: docker/build-push-action@v7
        with:
          context: ./postfix
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/postfix:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/postfix:${{ github.sha }}

      - name: Build and push Dovecot
        uses: docker/build-push-action@v7
        with:
          context: ./dovecot
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dovecot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dovecot:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Ansible & Collections
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-playbook -i inventory.ini site.yml --vault-id .vault_pass -e "app_version=${{ github.sha }}"
          rm -f .vault_pass
